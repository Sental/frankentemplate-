; =============================================================================
; opcache.ini: OPcache for the prod image (dev replaces it with opcache.dev.ini).
; Mage-OS is a large codebase (vendor/ plus generated/), so memory and file
; limits are sized for it.
; =============================================================================

opcache.enable = 1
opcache.enable_cli = 1

opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 60000

; The code in a prod image never changes, so skip the stat check entirely. Each
; release replaces the container, so a stale cache can't outlive the code.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Magento reads annotations and attributes at runtime.
opcache.save_comments = 1
opcache.load_comments = 1

; Conservative JIT: function mode has proven stable with Magento's interceptors;
; tracing has not.
opcache.jit = function
opcache.jit_buffer_size = 128M

opcache.consistency_checks = 0
opcache.huge_code_pages = 0
