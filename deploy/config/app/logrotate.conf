# Rotation for Magento's own log files. The cron service runs this daily as
# www-data (stack-entrypoint, logrotate_loop). Docker's own logs are bounded
# separately, per service, in the compose files.
#
# copytruncate: Magento keeps no log file handle open across requests that a
# signal could reopen, so copying and truncating is the safe way to rotate.
/app/var/log/*.log /app/var/debug/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
