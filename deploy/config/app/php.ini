; =============================================================================
; php.ini: PHP settings for every role (FrankenPHP workers, cron, consumers, CLI).
; Baked into the image at $PHP_INI_DIR/php.ini.
; =============================================================================

; --- Error handling ---
; Errors never go to the browser; they're logged under var/log, which the dev
; log-tailer streams to Dozzle.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /app/var/log/php-errors.log
; No E_STRICT: PHP 8.4 deprecated the constant, and it has reported nothing since 8.0.
error_reporting = E_ALL & ~E_DEPRECATED

; --- Limits ---
memory_limit = 756M
max_execution_time = 600
max_input_time = 600
max_input_vars = 10000

; --- Uploads (admin imports, product images) ---
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M

; --- Session ---
; Sessions live in Valkey; env.php configures that. These are only PHP's fallbacks.
session.save_handler = files
session.gc_maxlifetime = 7200

; --- Date ---
date.timezone = UTC

; --- Realpath cache ---
; Magento resolves a great many paths; a large cache saves stat calls.
realpath_cache_size = 10M
realpath_cache_ttl = 7200

; --- Misc ---
short_open_tag = Off
expose_php = Off
; Off: PHP would otherwise gzip every cache miss in the worker, which Varnish then
; has to gunzip for ESI, and Cloudflare recompresses for the client anyway. Varnish
; compresses once, when it stores the object (FINDINGS F-30).
zlib.output_compression = Off
