; =============================================================================
; Supervisor base config for the consumers service.
; stack-entrypoint copies this to /tmp/supervisord.conf and appends one [program:]
; per MAGENTO_CONSUMERS entry. Supervisor itself runs as root so it can write to
; the container's stdout; every program runs as www-data (user= on each program).
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
