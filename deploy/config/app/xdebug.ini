; =============================================================================
; xdebug.ini: Xdebug for the dev image.
; The mode comes from the XDEBUG_MODE environment variable (default off), which
; `bin/xdebug on|off` switches; that recreates the app container.
; =============================================================================

; Only debug when the IDE asks (XDEBUG_TRIGGER, or a browser extension's cookie),
; so having it on doesn't slow every request.
xdebug.start_with_request = trigger
; Docker Desktop resolves this name to the Windows host, where the IDE listens.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = 0
xdebug.log_level = 0
