; =============================================================================
; opcache.dev.ini: OPcache for the dev image.
; Timestamps are validated, so edited files recompile. Classes already loaded into
; a long-lived worker still need a worker restart, which FRANKENPHP_WATCH=1 does
; automatically.
; =============================================================================

opcache.enable = 1
opcache.enable_cli = 1

opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 60000

opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

opcache.save_comments = 1
opcache.load_comments = 1

; No JIT in dev: simpler stack traces, and it doesn't fight Xdebug.
opcache.jit = disable
opcache.jit_buffer_size = 0

opcache.consistency_checks = 0
opcache.huge_code_pages = 0
